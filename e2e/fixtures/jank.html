<!doctype html>
<html><head><meta charset="utf-8"><title>jank fixture</title>
<style>
  html,body { margin:0; padding:0; background:#fafafa; height:100vh; }
  .box {
    width: 120px; height: 120px; background:#33d;
    position: absolute; top: 200px; left: 0;
    animation: jankymove 1000ms linear forwards;
  }
  @keyframes jankymove {
    0%    { left: 0; }
    20%   { left: 200px; }
    20.1% { left: 700px; }      /* sudden jank jump */
    40%   { left: 720px; }
    100%  { left: 1000px; }
  }
</style></head>
<body><div class="box"></div></body></html>
