<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ai-motionlens fixture — rAF-only counter, no CSS sources</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: monospace; }
  #stat {
    position: absolute; top: 200px; left: 100px;
    font-size: 96px; font-weight: 700; color: #111;
    /* No CSS animation. No CSS transition. The motion is entirely
       JS-driven so the CDP Animation domain reports zero sources and
       `coverage_score` is structurally 0. */
  }
</style>
</head>
<body>
  <div id="stat">0</div>
  <script>
    // Pure rAF count-up — same shape as a stats counter on a real
    // page. The fixture is the regression target for "coverage gate
    // auto-skip on rAF/GSAP-only pages".
    const stat = document.getElementById('stat');
    const FINAL = 100;
    const DURATION_MS = 800;
    let t0 = null;
    function tick(t) {
      if (t0 === null) t0 = t;
      const progress = Math.min(1, (t - t0) / DURATION_MS);
      stat.textContent = String(Math.floor(progress * FINAL));
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
