<!doctype html>
<html><head><meta charset="utf-8"><title>scroll fixture</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { height: 4000px; background: linear-gradient(#fff, #ddd); }
  .hero { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
          width: 240px; height: 240px; background: #28e; border-radius: 50%; }
  .hero { transition: none; }
</style></head>
<body>
  <div class="hero" id="hero"></div>
  <script>
    // simple scroll-progress -> hero scale + color (no easing).
    function update() {
      const p = Math.min(1, window.scrollY / 3000);
      const el = document.getElementById('hero');
      el.style.transform = `translate(-50%, -50%) scale(${1 + p * 1.5}) rotate(${p * 360}deg)`;
      el.style.background = `hsl(${200 + p * 160}, 80%, 50%)`;
    }
    window.addEventListener('scroll', update, { passive: true });
    update();
  </script>
</body></html>
