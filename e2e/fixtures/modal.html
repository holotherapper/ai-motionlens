<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ai-motionlens modal fixture</title>
<style>
  html, body { margin: 0; padding: 0; height: 100vh; font-family: -apple-system, sans-serif; background: #f5f5f5; }
  .open-btn {
    position: absolute; top: 40px; left: 40px;
    padding: 12px 24px; background: #2a6; color: white; border: 0; border-radius: 6px; font-size: 18px; cursor: pointer;
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0); pointer-events: none;
    transition: background 300ms linear;
  }
  .modal-backdrop.open { background: rgba(0,0,0,0.4); pointer-events: auto; }
  .modal {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, calc(-50% + 40px));
    background: white; padding: 32px 48px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity 300ms ease-out, transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    min-width: 280px;
  }
  .modal.open { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
</style>
</head>
<body>
  <button class="open-btn" id="open-modal">Open modal</button>
  <div class="modal-backdrop" id="backdrop"></div>
  <div class="modal" id="modal">
    <h2>Hello</h2>
    <p>I am a modal that fades in and slides up over ~300ms.</p>
  </div>
  <script>
    document.getElementById('open-modal').addEventListener('click', () => {
      document.getElementById('backdrop').classList.add('open');
      document.getElementById('modal').classList.add('open');
    });
  </script>
</body>
</html>
