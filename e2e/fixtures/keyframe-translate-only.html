<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ai-motionlens fixture — @keyframes translateY only</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  /* A canonical hero-entrance pattern: `transform: translateY(20px)` →
     `translateY(0)` over 800ms — the "hero word rise" pattern. Here
     `per_target_easing` could return opacity-only axes because the
     layout probe couldn't see the translate via
     `getComputedStyle().transform` on a paused virtual clock. The
     transform reconciliation pass (translate-only path) resolves
     `axis: transform-translate-y` and feeds it back into
     `detected_motion_kinds`. */
  .word {
    display: inline-block;
    font-size: 64px; font-weight: 700;
    margin-right: 12px;
    transform: translateY(20px);
    animation: word-rise 800ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  @keyframes word-rise {
    from { transform: translateY(20px); }
    to   { transform: translateY(0); }
  }
</style>
</head>
<body>
  <h1 id="hero">
    <span class="word">design</span><span class="word">motion</span><span class="word">studio</span>
  </h1>
</body>
</html>
