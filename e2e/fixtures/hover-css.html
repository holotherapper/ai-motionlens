<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ai-motionlens hover-css fixture</title>
<style>
  html, body { margin: 0; padding: 0; height: 100vh; background: #fafafa; font-family: -apple-system, sans-serif; }
  .target {
    position: absolute;
    top: 200px;
    left: 100px;
    width: 160px;
    height: 80px;
    background: #2a6;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 300ms linear, background 300ms linear;
  }
  /* This pseudo-class only fires under a real compositor hover. A JS
     `dispatchEvent(new MouseEvent('mouseenter'))` does NOT activate it —
     it is the canonical way to tell whether the agent used CDP input or
     JS dispatch. */
  .target:hover {
    transform: translateX(220px);
    background: #d33;
  }
</style>
</head>
<body>
  <div class="target" id="target">Hover me</div>
</body>
</html>
