<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ai-motionlens fixture — many elements (MCP response cap)</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #grid { display: flex; flex-wrap: wrap; padding: 8px; }
  /* 160 boxes, each laid out -> 160+ entries in every layout_snapshot.
     With include_layout + include_frame_detail across 8 samples this
     pushes the full report well past the MCP token ceiling, exercising
     the server-side response-cap degradation (DESIGN §14). */
  .box {
    width: 64px; height: 64px; margin: 5px;
    background: #3366ff; border-radius: 6px;
    animation: rise 1000ms cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes rise {
    from { transform: translateY(48px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
</style>
</head>
<body>
  <div id="grid"></div>
  <script>
    // Deterministic: 160 boxes, all rise on load. No randomness, no
    // trigger — observable from true t=0 under the virtual clock.
    var g = document.getElementById('grid'), h = '';
    for (var i = 0; i < 160; i++) { h += '<div class="box" id="box-' + i + '"></div>'; }
    g.innerHTML = h;
  </script>
</body>
</html>
