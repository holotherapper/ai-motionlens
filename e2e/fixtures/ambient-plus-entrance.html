<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ai-motionlens fixture — ambient loops + a single entrance</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }

  /* The hero entrance is the only interval-specific source — it runs
     once for 600ms then settles. */
  #hero {
    position: absolute; top: 80px; left: 80px;
    width: 200px; height: 60px; background: #1f6feb;
    opacity: 0;
    animation: hero-enter 600ms linear forwards;
  }
  @keyframes hero-enter {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Three ambient loops that run for the whole sample window
     (orb-float, mark-spin, marquee) — the shape of page that floods
     unobserved_intervals[]. */
  #orb {
    position: absolute; top: 200px; left: 200px;
    width: 120px; height: 120px;
    background: radial-gradient(closest-side, #f5c87a, transparent);
    animation: orb-float 8000ms linear infinite;
  }
  @keyframes orb-float {
    from { transform: translateY(0); }
    to   { transform: translateY(20px); }
  }
  #mark {
    position: absolute; top: 16px; right: 16px;
    width: 40px; height: 40px; background: #444;
    border-radius: 50%;
    animation: mark-spin 6000ms linear infinite;
  }
  @keyframes mark-spin {
    from { transform: rotate(0); }
    to   { transform: rotate(360deg); }
  }
  #marquee-track {
    position: absolute; bottom: 80px; left: 0;
    width: 200%; height: 32px;
    background: linear-gradient(90deg, #d3d3d3, #efefef, #d3d3d3);
    animation: marquee 10000ms linear infinite;
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <div id="hero"></div>
  <div id="orb"></div>
  <div id="mark"></div>
  <div id="marquee-track"></div>
</body>
</html>
