<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ai-motionlens animation fixture</title>
<style>
  html, body { margin: 0; padding: 0; height: 100vh; background: #fafafa; font-family: -apple-system, sans-serif; }
  .stage { position: relative; width: 100%; height: 100%; }
  .box {
    width: 120px;
    height: 120px;
    background: #d33;
    position: absolute;
    top: 200px;
    left: 0;
    animation: move 1000ms linear forwards;
  }
  @keyframes move {
    from { left: 0;       transform: rotate(0deg); }
    to   { left: 1000px;  transform: rotate(360deg); }
  }
  .label { padding: 20px; font-size: 18px; color: #333; }
</style>
</head>
<body>
  <div class="stage">
    <div class="label">CSS animation fixture: red box translates 0px to 1000px over 1000ms (linear), with a 360deg rotation.</div>
    <div class="box"></div>
  </div>
</body>
</html>
