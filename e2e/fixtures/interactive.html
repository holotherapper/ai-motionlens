<!doctype html>
<html>
<head>
<meta charset="utf-8"><title>interactive</title>
<style>
  body { margin: 0; padding: 24px; font-family: sans-serif; }
  #hover-target {
    width: 200px; height: 80px; background: #999; color: white; display: grid; place-items: center;
    transition: background 200ms ease;
  }
  #hover-target:hover { background: #c33; }
  #scroll-zone { height: 2000px; background: linear-gradient(180deg, #eef, #fee); margin-top: 32px; }
  #evaluated { padding: 12px; background: #efe; margin-top: 12px; }
</style>
</head>
<body>
<input id="name-input" type="text" placeholder="type here" />
<div id="hover-target">hover me</div>
<button id="counter-btn" onclick="window.__count = (window.__count || 0) + 1">click me</button>
<div id="evaluated">eval not yet run</div>
<div id="scroll-zone"></div>
</body>
</html>
